# Local dev stack for the 440hz executor.
#
# What this gives you:
#   - The sample SQL gym, built from examples/sample-gym
#   - The 440hz executor, configured to point at the gym + Ollama as supervisor
#
# Prerequisites:
#   - Docker with GPU support (nvidia-container-toolkit) for the executor
#   - Ollama running on the host (port 11434) with `qwen2.5:7b` pulled, OR
#     edit configs/task.example.json to use a different supervisor

services:

  # The Provider API Daemon — FastAPI service that manages training tasks,
  # streams real metrics to the web console, and handles 0G network registration.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: 440hz/provider-api:latest
    container_name: 440hz-api
    ports:
      - "8420:8420"
    networks: [hz_net]
    environment:
      LOG_LEVEL: INFO
      PORT: "8420"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      PROVIDER_PRIVATE_KEY: ${PROVIDER_PRIVATE_KEY:-${PRIVATE_KEY:-}}
      RPC_URL: ${RPC_URL:-https://evmrpc-testnet.0g.ai}
      PROVIDER_ENDPOINT: ${PROVIDER_ENDPOINT:-http://localhost:8420}
      PROVIDER_MODELS: ${PROVIDER_MODELS:-Qwen/Qwen2.5-7B-Instruct}
      PROVIDER_PRICE_PER_TOKEN: ${PROVIDER_PRICE_PER_TOKEN:-1000000000}
      PROVIDER_CPU_COUNT: ${PROVIDER_CPU_COUNT:-8}
      PROVIDER_MEMORY_GB: ${PROVIDER_MEMORY_GB:-64}
      PROVIDER_GPU_COUNT: ${PROVIDER_GPU_COUNT:-1}
      PROVIDER_GPU_TYPE: ${PROVIDER_GPU_TYPE:-}
      PROVIDER_STORAGE_GB: ${PROVIDER_STORAGE_GB:-200}
      # Let the daemon spawn the executor in the same Python env.
      HZ_PYTHONPATH: /opt/440hz
      HZ_EXECUTOR_MODULE: executor.orchestrator
      GYM_OVERRIDE_URL: http://gym:8080
    volumes:
      - provider_state:/root/.440hz
      - executor_scratch:/var/440hz
      # Mount source so code changes are picked up on restart, no rebuild needed.
      - ./api:/opt/440hz/api
      - ./scripts:/opt/440hz/scripts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      gym:
        condition: service_healthy

  # The Gym — built from the example dir, runs the SQL debugging environment.
  gym:
    build:
      context: .
      dockerfile: examples/sample-gym/Dockerfile
    image: 440hz/sample-sql-gym:latest
    container_name: 440hz-gym
    networks: [hz_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # The Executor — runs the orchestrator. In local mode we skip the nested
  # DinD entirely and let the orchestrator hit the gym container by name on
  # the shared compose network. To do this we set RUNTIME=external and the
  # executor talks to the gym at `http://gym:8080` directly.
  executor:
    build:
      context: .
      dockerfile: executor/Dockerfile
    image: 440hz/executor:latest
    container_name: 440hz-executor
    depends_on:
      gym:
        condition: service_healthy
    networks: [hz_net]
    environment:
      LOG_LEVEL: INFO
      TASK_CONFIG: /etc/440hz/task.json
      # In local compose mode the gym is reachable by service name; the
      # orchestrator's GymContainer wrapper is bypassed via this env var.
      GYM_OVERRIDE_URL: http://gym:8080
      # 0G broker creds. Set these in a `.env` file next to this compose file.
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      RPC_URL: ${RPC_URL:-https://evmrpc-testnet.0g.ai}
      # Make the executor able to see Ollama on the host (used as supervisor in
      # the example config). Adjust per OS — the literal `host.docker.internal`
      # works on Docker Desktop / WSL2 / recent Linux Docker.
      OLLAMA_HOST: host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./configs/task.example.json:/etc/440hz/task.json:ro
      - executor_scratch:/var/440hz
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  hz_net:
    driver: bridge

volumes:
  executor_scratch:
  provider_state:
